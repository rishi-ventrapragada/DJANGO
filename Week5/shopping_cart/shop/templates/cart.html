{% extends 'base.html' %}
{% block content %}
<h2>Your Cart</h2>
<ul>
    {% for item in items %}
        <li>
            {{ item.product.name }} (x{{ item.quantity }}) - ${{ item.subtotal }}
            <form method="post" action="{% url 'update_cart' item.id %}">
                {% csrf_token %}
                {{ item.quantity }}
                <input type="number" name="quantity" value="{{ item.quantity }}" min="1">
                <button type="submit">Update</button>
            </form>
        </li>
    {% endfor %}
</ul>
<p>Total: ${{ total }}</p>
{% endblock %}
