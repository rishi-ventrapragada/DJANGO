<form method="post" action="{% url 'result' %}">
    {% csrf_token %}
    {% for question in questions %}
        <h3>{{ question.text }}</h3>
        {% for choice in question.choices.all %}
            <input type="radio" name="{{ question.id }}" value="{{ choice.id }}">
            {{ choice.text }}<br>
        {% endfor %}
    {% endfor %}
    <button type="submit">Submit</button>
</form>
